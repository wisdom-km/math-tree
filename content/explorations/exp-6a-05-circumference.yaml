# 探究单：圆的周长
# 交互稿：docs/explorations/circle-circumference.md。提问卡文案逐字取自交互稿第 5 节。

id: exp-6a-05-circumference
title: 圆的周长
component: circle-circumference
status: draft
level: L3
durationMinutes: 35–40
pages: p60–64（回忆依赖 p55–56）
spec: docs/explorations/circle-circumference.md

primaryNode: 6a-05-05
coversNodes: [6a-05-04, 6a-05-06]
prerequisites: [3a-08, 6a-05-01]
methods: [M-11]
confusionEdges:
  - a: 6a-05-04
    b: 6a-05-08

questionCards:
  - step: 0
    questions:
      - 圆心决定圆的什么？半径决定圆的什么？
      - 同一个圆里，有多少条半径？它们一样长吗？
      - 如果只给你直径 6 cm，半径是多少？不用再量为什么？
  - step: 1
    questions:
      - 不用公式，你怎么量出「箍一圈」要多长？
      - 圆大一点，铁皮是变长还是变短？和什么有关？
      - 「滚一圈」走的地面长，和「围一圈」的边线长，是不是一回事？
  - step: 2
    questions:
      - 你的「最可能」大概是直径的几倍？为什么不是 2 倍？
      - 「太高」你敢报到多少？有没有上限感觉？
      - 如果直径变成 8 cm，你的猜测要不要改？怎么改？
  - step: 3
    questions:
      - 红点又贴回地面时，说明什么？
      - 地面这段长，和铁皮箍一圈的长，是什么关系？
      - 只滚半圈，能不能当周长？为什么？
    handVote: [偏长, 偏短, 接近]
  - step: 4
    questions:
      - 看看「周长÷直径」这一列，什么没怎么变？什么变了？
      - 直径越大，周长怎么变？比值呢？
      - 如果有一行比值差很多，可能是什么原因？（测量/没滚满）
    handVote: [同意, 不同意]
  - step: 5
    questions:
      - 「大约 3 倍」和「正好 3 倍」差在哪？古人说「周三径一」是什么意思？
      - 为什么不同的圆，倍数却差不多？
      - 只用一行数据够不够下结论？为什么要多测几个？
    handVote: [不到3, 正好3, 3倍多一些, 4倍左右]
  - step: 6
    questions:
      - π 是「正好 3.14」还是「约等于 3.14」？为什么作业里常写 3.14？
      - 已知直径会用哪条公式？已知半径呢？把直径当半径代进去会怎样？
      - C = πd 和 C = 2πr 为什么是一回事？（回到 d = 2r）
    handVote: [是, 不是]
  - step: 7
    questions:
      - 先算再滚，和先滚再看，哪一步更像「用规律」？
      - 直径翻倍，周长怎么变？面积会怎样？（钩子，不展开）
      - 谁的「最可能」最接近？他当时是怎么想的？
    handVote: [预测偏长, 预测偏短, 几乎准]
  # 步骤 8 为提问卡合集入口，不单列问题；抽屉按当前 step 过滤，步骤 8 显示全部。
  - step: 9
    questions:
      - 正六边形周长和圆比，谁更长？边数变多时谁在靠近谁？
      - 为什么正方形周长是 4 个直径，圆却不到 4 个？
      - 周长在「边」上，面积在「面」上——调半径时，谁变快？（引到易混并排）
    handVote: [还比圆短, 一样长, 比圆长]
