questionCards:
  - step: 0
    questions:
      - 长方形为什么可以「数格子」求面积？圆能数格子吗？（钩子）
      - 三角形面积为什么要 ÷2？那个「2」从哪里来？
      - 上节课我们量出圆的周长是 2πr，今天要求的「面」和那条「边」有什么不同？
  - step: 1
    questions:
      - 长方形能数格子，圆为什么不好数？卡在哪里？
      - 如果一定要数，你会怎么处理边上的半格？
      - 以前学平行四边形的时候我们是怎么把「不好算」变成「好算」的？（引出转化）
  - step: 2
    questions:
      - 你的「最可能」大概是外面正方形的几分之几？为什么不是一半？
      - 如果半径变成 8 cm，面积是变成 2 倍还是更多？（钩子，步骤 7 回收）
      - 猜的时候你在心里把圆「变成」了什么图形？
  - step: 3
    questions:
      - 剪开的每一小份像什么图形？份数越多，它越像什么？
      - 拼出来的图形上下边为什么是「毛毛的」？怎么让它更平？
      - 拼的时候面积变了吗？变的是什么？没变的是什么？（转化的核心）
    handVote: [像, 不像, 说不准]
  - step: 4
    questions:
      - n 从 8 到 64，「长」这一列怎么变？在靠近哪个数？和上节课的周长有什么关系？
      - 「宽」这一列呢？它一直是多少？
      - 面积近似值越来越接近一个数——这个数是圆的什么？
    handVote: [同意, 不同意]
  - step: 5
    questions:
      - 长方形的长为什么是周长的「一半」而不是周长？上排和下排各占了多少？
      - 如果拼出来的长方形长是 πr、宽是 r，面积怎么算？把「长 × 宽」写出来。
      - 只看 n = 8 那一行能下这个结论吗？为什么要看到 64？
    handVote: [长是周长, 长是周长的一半, 长是直径, 说不准]
  - step: 6
    questions:
      - r² 是 r × 2 吗？r = 4 时 r² 是多少？
      - 已知直径 d = 10，能直接代进 S = πr² 吗？先要做什么？
      - 两条路——拼长方形、拆三角形——为什么最后都是 πr²？
    handVote: ["8", "16"]
  - step: 7
    questions:
      - 先算再拼，和先拼再看，哪一步更像「用规律」？
      - 半径变成 2 倍，面积变成几倍？周长呢？为什么不一样？（引到易混并排）
      - 谁的「最可能」最接近？他当时把圆想成了什么？
    handVote: [预测偏多, 预测偏少, 几乎准]
  # 步骤 8 为提问卡合集入口，不单列问题；抽屉按当前 step 过滤，步骤 8 显示全部。
  - step: 9
    questions:
      - 圆环面积为什么不能用「外半径 − 内半径」再平方？
      - 外圆内方里正方形的边长是多少？为什么要拆成两个三角形来算？（又是转化）
      - 半径变大时，周长和面积谁「跑得快」？为什么？（引到易混并排）
    handVote: ["2", "4", "3.14"]
