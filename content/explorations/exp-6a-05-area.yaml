# 探究单：圆的面积
# 交互稿：docs/explorations/circle-area.md。提问卡文案逐字取自交互稿第 5 节。

id: exp-6a-05-area
title: 圆的面积
component: circle-area
status: draft
level: L3
durationMinutes: "40"
pages: p65–68（回忆依赖三下长方形面积、五上多边形面积）
spec: docs/explorations/circle-area.md

primaryNode: 6a-05-07
coversNodes: [6a-05-08]
prerequisites: [5a-06, 5a-07, 6a-05-06]
methods: [M-04, M-10, M-11]
confusionEdges:
  - a: 6a-05-08
