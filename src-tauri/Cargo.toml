[package]
name = "math-tree"
version = "0.1.0"
description = "人教版小学数学知识树教学系统"
authors = ["wisdom-km"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "math_tree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
